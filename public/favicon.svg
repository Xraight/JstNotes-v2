<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="8" />

  <!-- Inner Soft Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" opacity="0.15" />

  <!-- Stylized Open Book / Pages -->
  <path d="M120 330 C 180 300, 220 310, 256 340 C 292 310, 332 300, 392 330 L 392 190 C 332 160, 292 170, 256 200 C 220 170, 180 160, 120 190 Z" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Spine Line -->
  <line x1="256" y1="200" x2="256" y2="340" stroke="#a855f7" stroke-width="14" stroke-linecap="round" />

  <!-- Neural/Knowledge Nodes -->
  <circle cx="256" cy="140" r="20" fill="#38bdf8" />
  <circle cx="180" cy="110" r="14" fill="#818cf8" />
  <circle cx="332" cy="110" r="14" fill="#c084fc" />
  
  <line x1="180" y1="110" x2="256" y2="140" stroke="#6366f1" stroke-width="6" opacity="0.8" />
  <line x1="332" y1="110" x2="256" y2="140" stroke="#a855f7" stroke-width="6" opacity="0.8" />
  <line x1="256" y1="140" x2="256" y2="200" stroke="#a855f7" stroke-width="6" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Text lines on left page -->
  <line x1="160" y1="220" x2="220" y2="228" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  <line x1="160" y1="255" x2="220" y2="263" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  <line x1="160" y1="290" x2="205" y2="296" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.7" />

  <!-- Text lines on right page -->
  <line x1="292" y1="228" x2="352" y2="220" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  <line x1="292" y1="263" x2="352" y2="255" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  <line x1="292" y1="296" x2="337" y2="290" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.7" />
</svg>
