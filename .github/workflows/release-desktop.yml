name: Release Desktop Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_target: release/*.AppImage
            target_platform: linux
          - os: windows-latest
            artifact_target: release/*.exe
            target_platform: win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build web assets and backend server
        run: npm run build

      - name: Build Linux AppImage
        if: matrix.target_platform == 'linux'
        run: npx electron-builder --linux AppImage --publish never
        env:
          USE_HARD_LINKS: "false"

      - name: Build Windows Executable (.exe & portable)
        if: matrix.target_platform == 'win'
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Binary Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_target }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
