name: CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check (Strict)
        run: npm run typecheck

      - name: Compile Production Bundle (Vite + esbuild)
        run: npm run build

      - name: Server Health Check Smoke Test
        run: |
          echo "Starting production server in background..."
          node dist/server.cjs &
          SERVER_PID=$!

          echo "Waiting for server to listen on port 3000..."
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'; then
              echo "Server health check passed successfully!"
              kill -TERM $SERVER_PID || true
              exit 0
            fi
            sleep 1
          done

          echo "Server failed to respond to /api/health within 30 seconds"
          kill -9 $SERVER_PID || true
          exit 1
